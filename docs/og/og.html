<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=JetBrains+Mono:wght@400&family=Syne:wght@800&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 700px 520px at 930px 330px, #23262b 0%, rgba(35,38,43,0) 70%),
      linear-gradient(135deg, #16181b 0%, #111214 55%, #0d0e10 100%);
    color: #f2f2f2;
    position: relative;
  }
  .left { position: absolute; left: 78px; top: 100px; width: 680px; }
  .status {
    font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: 2.2px;
    color: #a3a3a3; text-transform: uppercase; display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px 2px rgba(52,211,153,.55); }
  h1 {
    font-family: "Syne", sans-serif; font-weight: 800; font-size: 86px; line-height: 0.98; white-space: nowrap;
    letter-spacing: -1px; margin-top: 30px; color: #f1f1f1;
  }
  .role { font-family: "DM Sans", sans-serif; font-weight: 500; font-size: 27px; margin-top: 34px; color: #f2f2f2; }
  .school { font-family: "JetBrains Mono", monospace; font-size: 16px; color: #8f8f8f; margin-top: 12px; }
  .chips { display: flex; gap: 10px; margin-top: 30px; }
  .chip {
    font-family: "JetBrains Mono", monospace; font-size: 15px; color: #cfcfcf;
    border: 1px solid #3a3d42; border-radius: 999px; padding: 7px 16px;
  }
  .url { font-family: "JetBrains Mono", monospace; font-size: 16px; color: #8f8f8f; margin-top: 40px; }

  .photo-wrap { position: absolute; left: 786px; top: 146px; width: 340px; height: 340px; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid #4a4d52;
    -webkit-mask: conic-gradient(from 300deg, #000 0 330deg, transparent 330deg);
  }
  .ring-hi {
    position: absolute; inset: 0; border-radius: 50%; border: 2px solid #e6e6e6;
    -webkit-mask: conic-gradient(from 300deg, #000 0 70deg, transparent 70deg);
  }
  .photo {
    position: absolute; inset: 12px; border-radius: 50%; overflow: hidden;
    background: #cfcfcf;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.04); }
</style>
</head>
<body>
  <div class="left">
    <div class="status"><span class="dot"></span>Open to junior developer roles &amp; freelance work</div>
    <h1>Jann Carl<br>Dungo</h1>
    <div class="role">Software Developer</div>
    <div class="school">BSIT — Web Development · Holy Angel University</div>
    <div class="chips"><span class="chip">React</span><span class="chip">Node.js</span><span class="chip">Laravel</span><span class="chip">PostgreSQL</span></div>
    <div class="url">janncarl.vercel.app</div>
  </div>
  <div class="photo-wrap">
    <div class="ring"></div><div class="ring-hi"></div>
    <div class="photo"><img src="../../public/images/profile.jpg" alt=""></div>
  </div>
</body>
</html>
