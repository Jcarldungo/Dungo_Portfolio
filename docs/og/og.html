<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Link-preview image (1200x630). Matches the home page: Figtree, the
     #111112 ground, Georgia italic accent, the profile row and the green
     availability line. Screenshot at 1200x630 to regenerate. -->
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 900px 600px at 20% 0%, #1a1a1c 0%, rgba(26,26,28,0) 70%),
      #111112;
    color: #efefef;
    font-family: "Figtree", sans-serif;
    padding: 104px 88px 0;
  }
  .profile { display: flex; align-items: center; gap: 22px; }
  .profile img { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; }
  .name { font-size: 34px; font-weight: 600; letter-spacing: -0.6px; line-height: 1.15; }
  .role { font-size: 23px; color: #a0a0a5; margin-top: 4px; }

  h1 { font-size: 64px; font-weight: 500; line-height: 1.2; letter-spacing: -2px; margin-top: 46px; }
  h1 em { font-family: Georgia, serif; font-weight: 400; letter-spacing: -1.4px; }

  .rule { height: 1px; background: #29292c; margin-top: 44px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
  .status { display: flex; align-items: center; gap: 12px; font-size: 22px; color: #c8c8cc; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px 1px rgba(52,211,153,.5); }
  .url { font-size: 22px; color: #a0a0a5; }
  .edu { font-size: 18px; color: #7d7d82; margin-top: 12px; padding-left: 22px; }
  .edu span + span::before { content: "\2003"; }
</style>
</head>
<body>
  <div class="profile">
    <img src="../../public/images/profile.jpg" alt="">
    <div><div class="name">Jann Carl Dungo</div><div class="role">Software Developer · Pampanga, PH</div></div>
  </div>
  <h1>I design and build<br>structured <em>full-stack systems.</em></h1>
  <div class="rule"></div>
  <div class="foot">
    <div class="status"><span class="dot"></span>Open to junior developer roles &amp; freelance work</div>
    <div class="url">janncarl.vercel.app</div>
  </div>
  <div class="edu"><span>BSIT — Web Development</span><span>Holy Angel University</span><span>Dean’s Lister (2023–present)</span></div>
</body>
</html>
